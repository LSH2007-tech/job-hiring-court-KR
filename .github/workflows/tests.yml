name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install optional file readers
        run: python -m pip install pypdf
      - name: Python tests (court_tool.py, local server, browser build)
        run: python -m unittest discover -s tests -v
      - name: Node tests (browser engine)
        run: node --test tests/
      - name: Syntax check of the front-end
        run: |
          node --check hiring-court/web/static/app.js
          node --check hiring-court/web/static/engine.js
